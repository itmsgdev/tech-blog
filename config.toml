baseURL = "https://itmsgdev.github.io/tech-blog/"
languageCode = "ko"
title = "아이티메세지 기술 블로그"
theme = "PaperModX"
paginate = 10

[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true
  [markup.highlight]
    style = "github"
    lineNos = true
    codeFences = true
    guessSyntax = true

[services]
  [services.rss]
    limit = 20

[outputs]
  home = ["HTML", "RSS", "JSON"]

[params]
  description = "아이티메세지 기술 블로그입니다"
  env = "production"
  ShowCodeCopyButtons = true
  ShowBreadCrumbs = true
  ShowPostNavLinks = true
  ShowWordCount = true
  ShowRssButtonInSectionTermList = true
  UseHugoToc = true
  disableSpecial1stPost = false
  disableScrollToTop = false
  hidemeta = false
  showtoc = false
  tocopen = false
  
  [params.homeInfoParams]
    Title = "안녕하세요! 👋"
    Content = "블로그에 오신 것을 환영합니다."
  
  [params.assets]
    disableHLJS = false
    disableFingerprinting = false
