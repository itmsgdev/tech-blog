<div class="mermaid">
{{- .Inner | safeHTML }}
</div>
{{ if not (.Page.Scratch.Get "mermaid") }}
{{ .Page.Scratch.Set "mermaid" true }}
<script src="https://cdn.jsdelivr.net/npm/mermaid/dist/mermaid.min.js"></script>
<script>
mermaid.initialize({
    startOnLoad: true,
    theme: 'default',
    themeVariables: {
        fontSize: '16px'
    }
});
</script>
{{ end }}
