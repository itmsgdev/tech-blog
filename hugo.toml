baseURL = "https://itmsgdev.github.io/tech-blog/"
languageCode = "ko"
title = "아이티메세지 기술 블로그"
theme = "PaperModX"
paginate = 10

# 메뉴 설정
[[menu.main]]
identifier = "home"
name = "홈"
url = "/"
weight = 10

[[menu.main]]
identifier = "posts"
name = "블로그"
url = "/posts/"
weight = 20

[[menu.main]]
identifier = "archives"
name = "아카이브"
url = "/archives/"
weight = 30

[[menu.main]]
identifier = "search"
name = "검색"
url = "/search/"
weight = 40

[[menu.main]]
identifier = "tags"
name = "태그"
url = "/tags/"
weight = 50

# Sass/SCSS 처리를 위한 설정
[build]
  writeStats = true

[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true
  [markup.highlight]
    style = "github"
    lineNos = true
    codeFences = true
    guessSyntax = true

[services]
  [services.rss]
    limit = 20

[outputs]
  home = ["HTML", "RSS", "JSON"]
  page = ["HTML"]
  section = ["HTML", "RSS"]
  taxonomy = ["HTML", "RSS"]
  term = ["HTML", "RSS"]

[taxonomies]
  tag = "tags"

[params]
  description = "아이티메세지 기술 블로그입니다"
  author = "아이티메세지 개발팀"  # 기본 저자
  env = "production"  # GitHub Pages용
  ShowCodeCopyButtons = true
  ShowPostMeta = true      # 포스트 메타 정보 표시
  ShowAuthor = true        # 저자 정보 표시
  ShowBreadCrumbs = true
  ShowPostNavLinks = true
  ShowWordCount = true
  ShowRssButtonInSectionTermList = true
  UseHugoToc = true
  disableSpecial1stPost = false
  disableScrollToTop = false
  hidemeta = false
  showtoc = false
  tocopen = false
  
  [params.homeInfoParams]
    Title = "안녕하세요! 👋"
    Content = "블로그에 오신 것을 환영합니다."

  [params.assets]
    disableHLJS = false
    disableFingerprinting = true  # GitHub Pages에서 CSS 로딩 문제 해결
    favicon = "favicon.ico"
    favicon16x16 = "favicon-16x16.png"
    favicon32x32 = "favicon-32x32.png"
    apple_touch_icon = "apple-touch-icon.png"
    safari_pinned_tab = "safari-pinned-tab.svg"