baseURL = "https://itmsgdev.github.io/tech-blog/"
defaultContentLanguage = "ko"
title = "아이티메세지 기술 블로그"
theme = "PaperModX"

[pagination]
pagerSize = 10

# Sass/SCSS 처리를 위한 설정
[build]
  writeStats = true

[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true
  [markup.highlight]
    style = "github"
    lineNos = true
    codeFences = true
    guessSyntax = true

[services]
  [services.rss]
    limit = 20

[outputs]
  home = ["HTML", "RSS", "JSON"]
  page = ["HTML"]
  section = ["HTML", "RSS"]
  taxonomy = ["HTML", "RSS"]
  term = ["HTML", "RSS"]

[taxonomies]
  tag = "tags"
  category = "categories"

# 다국어 설정
[languages]
  [languages.ko]
    languageName = "한국어"
    weight = 1
    title = "아이티메세지 기술 블로그"
    
    [languages.ko.params]
      description = "아이티메세지 기술 블로그입니다"
      author = "아이티메세지 개발팀"
      
      [languages.ko.params.homeInfoParams]
        Title = "안녕하세요! 👋"
        Content = "아이티메세지 기술 블로그에 오신 것을 환영합니다."
    
    # 한국어 메뉴
    [[languages.ko.menu.main]]
    identifier = "home"
    name = "홈"
    url = "/"
    weight = 10
    
    [[languages.ko.menu.main]]
    identifier = "posts"
    name = "블로그"
    url = "/posts/"
    weight = 20
    
    [[languages.ko.menu.main]]
    identifier = "archives"
    name = "아카이브"
    url = "/archives/"
    weight = 30
    
    [[languages.ko.menu.main]]
    identifier = "search"
    name = "검색"
    url = "/search/"
    weight = 40
    
    [[languages.ko.menu.main]]
    identifier = "tags"
    name = "태그"
    url = "/tags/"
    weight = 50
    
    [[languages.ko.menu.main]]
    identifier = "categories"
    name = "카테고리"
    url = "/categories/"
    weight = 60

  [languages.en]
    languageName = "English"
    weight = 2
    title = "ITMSG Tech Blog"
    
    [languages.en.params]
      description = "ITMSG Technology Blog"
      author = "ITMSG Development Team"
      
      [languages.en.params.homeInfoParams]
        Title = "Welcome! 👋"
        Content = "Welcome to ITMSG Technology Blog."
    
    # 영어 메뉴
    [[languages.en.menu.main]]
    identifier = "home"
    name = "Home"
    url = "/en/"
    weight = 10
    
    [[languages.en.menu.main]]
    identifier = "posts"
    name = "Posts"
    url = "/en/posts/"
    weight = 20
    
    [[languages.en.menu.main]]
    identifier = "archives"
    name = "Archives"
    url = "/en/archives/"
    weight = 30
    
    [[languages.en.menu.main]]
    identifier = "search"
    name = "Search"
    url = "/en/search/"
    weight = 40
    
    [[languages.en.menu.main]]
    identifier = "tags"
    name = "Tags"
    url = "/en/tags/"
    weight = 50
    
    [[languages.en.menu.main]]
    identifier = "categories"
    name = "Categories"
    url = "/en/categories/"
    weight = 60

[params]
  env = "production"  # GitHub Pages용
  displayFullLangName = true  # 언어 전체 이름 표시
  ShowCodeCopyButtons = true
  ShowPostMeta = true
  ShowAuthor = true
  ShowBreadCrumbs = true
  ShowPostNavLinks = true
  ShowWordCount = true
  ShowRssButtonInSectionTermList = true
  UseHugoToc = true
  disableSpecial1stPost = false
  disableScrollToTop = false
  hidemeta = false
  showtoc = false
  tocopen = false
  # Mermaid 다이어그램 지원
  mermaid = true

  # Giscus 댓글 시스템 설정
  [params.giscus]
    enable = true
    repo = "itmsgdev/tech-blog"              # GitHub 저장소 (owner/repo)
    repoId = "R_kgDOPRM8Gw"                  # 저장소 ID (giscus.app에서 생성)
    category = "Comments"                     # Discussion 카테고리
    categoryId = "DIC_kwDOPRM8G84CtqNO"          # 카테고리 ID (giscus.app에서 생성)
    mapping = "pathname"                     # 페이지 매핑 방식
    strict = "0"                            # 엄격한 제목 매칭
    reactionsEnabled = "1"                  # 반응 기능 활성화
    emitMetadata = "0"                      # 메타데이터 전송
    inputPosition = "bottom"                # 입력창 위치
    theme = "preferred_color_scheme"        # 테마
    lang = "ko"                             # 언어
    loading = "lazy"                        # 지연 로딩

  [params.assets]
    disableHLJS = false
    disableFingerprinting = true
    favicon = "favicon.ico"
    favicon16x16 = "favicon-16x16.png"
    favicon32x32 = "favicon-32x32.png"
    apple_touch_icon = "apple-touch-icon.png"
    safari_pinned_tab = "safari-pinned-tab.svg"